<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Authorisation code</title>
<style>
  :root { --bg:#fbfaf7; --text:#1f1f1f; --muted:#5f5f5f; --accent:#2f5d50; --box:#ffffff; box-sizing:border-box;
    padding-top: env(safe-area-inset-top,0px); padding-bottom: env(safe-area-inset-bottom,0px); }
  @media (prefers-color-scheme: dark){ :root{ --bg:#161816; --text:#ebebe8; --muted:#a5a8a3; --accent:#7fb5a4; --box:#20241f; } }
  *,*::before,*::after{ box-sizing:inherit; }
  body{ margin:0; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; line-height:1.6; }
  main{ max-width:38rem; margin:0 auto; padding:3rem 1.25rem; }
  h1{ font-size:1.5rem; margin:0 0 1rem; }
  code{ display:block; background:var(--box); border:1px solid var(--muted); border-radius:8px;
    padding:1rem; margin:1rem 0; word-break:break-all; font-size:1rem; overflow-x:auto; }
  button{ font:inherit; padding:0.6rem 1.1rem; border:0; border-radius:8px; background:var(--accent); color:#fff; cursor:pointer; }
  p.muted{ color:var(--muted); font-size:0.95rem; }
</style>
</head>
<body>
<main>
  <h1>Authorisation code</h1>
  <p>Copy this code and paste it into the terminal command.</p>
  <code id="code">No code in the address bar.</code>
  <button id="copy">Copy code</button>
  <p class="muted">Then run: python3 tools/pinterest_auth.py code &lt;code&gt;</p>
</main>
<script>
  var code = new URLSearchParams(window.location.search).get("code");
  if (code) { document.getElementById("code").textContent = code; }
  document.getElementById("copy").addEventListener("click", function () {
    if (code) { navigator.clipboard.writeText(code); this.textContent = "Copied"; }
  });
</script>
</body>
</html>
